<span id="pcap-picker"{% if oob %} hx-swap-oob="true"{% endif %}>
  <select name="pcap" aria-label="Pcap file">
    {% for name in pcaps %}<option value="{{ name }}"{% if name == selected %} selected{% endif %}>{{ name }}</option>
    {% else %}<option value="">No pcap files yet</option>{% endfor %}
  </select>
</span>
