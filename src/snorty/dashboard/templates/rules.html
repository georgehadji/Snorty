{% extends "base.html" %}
{% set active = "rules" %}
{% block title %}Rules · Snorty{% endblock %}
{% block main %}
<div class="grid">
  <section class="card">
    <h2>Rule updates</h2>
    {% include "_rules_summary.html" %}
    <form class="filters" hx-post="/rules/update" hx-target="#update-status" hx-swap="outerHTML">
      <label class="check"><input type="checkbox" name="force"> Update even if unchanged</label>
      <button type="submit">Update now</button>
    </form>
    <div id="update-status" role="status"></div>
  </section>
  {% include "_home_net.html" %}
</div>
<div style="margin-top: 16px">{% include "_muted_card.html" %}</div>
{% endblock %}
