{% extends "base.html" %}
{% set active = "alerts" %}
{% block title %}Alerts · Snorty{% endblock %}
{% block main %}
<header class="title"><h1>Alerts</h1></header>
<form id="alert-filters" class="card filters" action="/alerts" method="get"
      hx-get="/alerts/rows" hx-target="#alert-rows" hx-swap="innerHTML" hx-trigger="change, submit">
  <label>SID
    <input name="sid" inputmode="numeric" pattern="[0-9]*" value="{{ f.sid if f.sid is not none else '' }}" placeholder="any">
  </label>
  <label>Priority
    <select name="priority">
      <option value=""{% if f.priority is none %} selected{% endif %}>All</option>
      <option value="1"{% if f.priority == 1 %} selected{% endif %}>1 only</option>
      <option value="2"{% if f.priority == 2 %} selected{% endif %}>1 and 2</option>
      <option value="3"{% if f.priority == 3 %} selected{% endif %}>1, 2 and 3</option>
    </select>
  </label>
  <label>Range
    <select name="range">
      <option value="1h"{% if f.range == "1h" %} selected{% endif %}>Last hour</option>
      <option value="24h"{% if f.range == "24h" %} selected{% endif %}>Last 24 hours</option>
      <option value="7d"{% if f.range == "7d" %} selected{% endif %}>Last 7 days</option>
      <option value="all"{% if f.range == "all" %} selected{% endif %}>All</option>
    </select>
  </label>
  <button type="submit">Apply</button>
</form>
<section class="card wide">
  <div class="scroll">
    <table class="alerts">
      <thead><tr><th>Time</th><th>P</th><th>Rule</th><th>Source</th><th>Destination</th><th>SID</th><th></th></tr></thead>
      <tbody id="alert-rows">{% include "_alert_rows.html" %}</tbody>
    </table>
  </div>
</section>
{% endblock %}
