[project]
name = "snorty"
version = "0.1.0"
description = "Local dashboard and tooling around a Snort 2.9 install"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
    "winotify>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snorty"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["snort: integration test that needs the Snort install at C:\\Snort"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["snorty.core.*", "snorty.snort.*", "snorty.sensor.*", "snorty.rules.*", "snorty.notify.*", "snorty.journal.*", "snorty.lab.*", "snorty.dashboard.*", "snorty.compose"]
strict = true

[[tool.mypy.overrides]]
module = ["winotify", "winotify.*"]
ignore_missing_imports = true
