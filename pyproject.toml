[project]
name = "snorty"
version = "0.1.0"
description = "Local dashboard and tooling around a Snort 2.9 install"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
    "winotify>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snorty"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.28.1",
    "import-linter>=2.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "snort: integration test that needs the Snort install at C:\\Snort",
    "tshark: integration test that needs Wireshark's tshark (skipped when it is not installed)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["snorty.core.*", "snorty.snort.*", "snorty.sensor.*", "snorty.rules.*", "snorty.notify.*", "snorty.journal.*", "snorty.lab.*", "snorty.dashboard.*", "snorty.compose"]
strict = true

[[tool.mypy.overrides]]
module = ["winotify", "winotify.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "snorty"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core is the domain: it imports no other snorty module"
type = "forbidden"
source_modules = ["snorty.core"]
forbidden_modules = [
    "snorty.snort", "snorty.sensor", "snorty.rules", "snorty.notify", "snorty.journal",
    "snorty.lab", "snorty.triage", "snorty.dashboard", "snorty.compose", "snorty.services",
    "snorty.headless",
]

[[tool.importlinter.contracts]]
name = "only the process adapters (snort, wireshark) run processes"
type = "forbidden"
source_modules = [
    "snorty.core", "snorty.sensor", "snorty.rules", "snorty.notify", "snorty.journal",
    "snorty.lab", "snorty.packets", "snorty.triage", "snorty.dashboard", "snorty.compose",
    "snorty.services", "snorty.headless",
]
forbidden_modules = ["subprocess"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "feature modules never reach up into the UI or the wiring"
type = "forbidden"
source_modules = [
    "snorty.snort", "snorty.sensor", "snorty.rules", "snorty.notify", "snorty.journal",
    "snorty.lab", "snorty.packets", "snorty.triage", "snorty.wireshark",
]
forbidden_modules = ["snorty.dashboard", "snorty.compose", "snorty.services", "snorty.headless"]
# the sensor's `-m` shim hands off to the headless runner; it is an entry point, not a dependency
ignore_imports = ["snorty.sensor.__main__ -> snorty.headless"]

[[tool.importlinter.contracts]]
name = "packets is the port side: it never imports its adapters"
type = "forbidden"
source_modules = ["snorty.packets"]
forbidden_modules = ["snorty.wireshark", "snorty.snort"]

[[tool.importlinter.contracts]]
name = "sibling features do not know each other"
type = "independence"
modules = [
    "snorty.sensor", "snorty.notify", "snorty.journal", "snorty.lab", "snorty.packets",
    "snorty.triage",
]
ignore_imports = ["snorty.sensor.__main__ -> snorty.headless"]
